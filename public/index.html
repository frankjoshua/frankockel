<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frank–Ockel Pets</title>
  <meta name="description" content="Archie, Baxter, Charlie and Boots: the pets of Josh Frank and Laura Ockel.">
  <meta property="og:title" content="Frank–Ockel Pets">
  <meta property="og:image" content="https://frankockel.com/img/charlie.jpg">
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <style>:root { --pet: #ff9e8a; --pet-soft: #ffe6df; --pet-deep: #24130f; }</style>
</head>
<body>
  <header class="hero solo">
    <div class="wrap">
      <div>
        <p class="eyebrow">The hall of fame</p>
        <h1 class="name">Frank–Ockel Pets</h1>
        <p class="epitaph">Good pets. Great times.</p>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <ul class="crew tilts">
        <li style="--card: #ccccff">
          <a class="friend-link" href="https://archietherat.com">
            <figure class="snap">
              <img src="img/archie.jpg" alt="Archie">
              <figcaption><span class="pet-name">Archie the Rat</span><span class="pet-dates">Passed away January 14, 2010</span><span class="visit">Visit Archie →</span></figcaption>
            </figure>
          </a>
        </li>
        <li style="--card: #7cc6fe">
          <a class="friend-link" href="https://baxterfrank.com">
            <figure class="snap">
              <img src="img/baxter.jpg" alt="Baxter">
              <figcaption><span class="pet-name">Baxter Frank</span><span class="pet-dates">Born between 2001 and 2003 – Died 12/21/2015</span><span class="visit">Visit Baxter →</span></figcaption>
            </figure>
          </a>
        </li>
        <li style="--card: #ffc53d">
          <a class="friend-link" href="https://charlieockel.com">
            <figure class="snap">
              <img src="img/charlie.jpg" alt="Charlie">
              <figcaption><span class="pet-name">Charlie Ockel</span><span class="pet-dates">August 2011 – April 18th, 2020</span><span class="visit">Visit Charlie →</span></figcaption>
            </figure>
          </a>
        </li>
        <li style="--card: #7ed9a6">
          <a class="friend-link" href="https://bootsockel.com">
            <figure class="snap">
              <img src="img/boots.jpg" alt="Boots">
              <figcaption><span class="pet-name">Boots Ockel</span><span class="pet-dates">Born around 2021 – Died October 3rd, 2026</span><span class="visit">Visit Boots →</span></figcaption>
            </figure>
          </a>
        </li>
      </ul>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p class="paws">Josh Frank &amp; Laura Ockel</p>
    </div>
  </footer>
</body>
</html>
